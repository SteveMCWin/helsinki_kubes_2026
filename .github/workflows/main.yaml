name: Release application

on:
  push:

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: ${{ secrets.GKE_PROJECT }}
  GKE_CLUSTER: dwk-cluster
  GKE_ZONE: europe-north1-b
  REGISTRY: europe-north1-docker.pkg.dev
  IMAGE_REPO : my-kubes-repo
  FRONTEND_IMAGE: todo_app_frontend
  BACKEND_IMAGE: todo_app_backend
  SERVICE: todo-app
  BRANCH: ${{ github.ref_name }}

jobs:
  build-publish-deploy:
    name: Build, Publish and Deploy
    runs-on: ubuntu-latest
    environment: GKE_PROJECT

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: "${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}"
          service_account: "${{ secrets.SERVICE_ACCOUNT }}"

      - name: 'Set up Cloud SDK'
        uses: google-github-actions/setup-gcloud@v3

      - name: 'Use gcloud CLI'
        run: gcloud info

      - name: 'Use gcloud registry'
        run: gcloud --quiet auth configure-docker $REGISTRY

      - name: 'Get GKE credentials'
        uses: google-github-actions/get-gke-credentials@v3
        with:
          cluster_name: '${{ env.GKE_CLUSTER }}'
          project_id: '${{ env.PROJECT_ID }}'
          location: '${{ env.GKE_ZONE }}'

      - name : 'Form the image names'
        run: |-
          echo "FRONTEND_IMAGE_TAG=$REGISTRY/$PROJECT_ID/$IMAGE_REPO/$FRONTEND_IMAGE:$BRANCH-$GITHUB_SHA" >> $GITHUB_ENV
          echo "BACKEND_IMAGE_TAG=$REGISTRY/$PROJECT_ID/$IMAGE_REPO/$BACKEND_IMAGE:$BRANCH-$GITHUB_SHA" >> $GITHUB_ENV

      - name: Build
        run: |-
          docker build --tag $FRONTEND_IMAGE_TAG ./todo_app/todo_front
          docker build --tag $BACKEND_IMAGE_TAG ./todo_app/todo_back

      - name: Publish
        run: |-
          docker push $FRONTEND_IMAGE_TAG
          docker push $BACKEND_IMAGE_TAG

      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@v3

      - name: Deploy
        run: |-
          # Define namespace name based on branch that was pushed to
          NAMESPACE_NAME=${GITHUB_REF#refs/heads/}

          # We want the master namespace to be project namespace
          if [[ $NAMESPACE_NAME == "master" ]]; then
            NAMESPACE_NAME="project"
          fi

          # I'm guessing that this pipeline is only meant for the project, since the course didn't explicitly mention the exercies services
          cd todo_app

          # If a tag was pushed, this command will fail, so we put '|| true' to continue
          kubectl create namespace $NAMESPACE_NAME || true
          kubectl config set-context --current --namespace=$NAMESPACE_NAME
          kustomize edit set namespace $NAMESPACE_NAME

          kustomize edit set image TODO/FRONT=$FRONTEND_IMAGE_TAG
          kustomize edit set image TODO/BACK=$BACKEND_IMAGE_TAG

          kustomize build . | kubectl apply -f -
          kubectl rollout status deployment $SERVICE -n $NAMESPACE_NAME
          kubectl get services -o wide -n $NAMESPACE_NAME
