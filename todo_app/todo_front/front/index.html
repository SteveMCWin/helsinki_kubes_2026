<!DOCTYPE html>
<html>
<head>
	<title>Todo App</title>
	<link rel="stylesheet" href="/style.css">
</head>
<body>
	<h1>Todo App</h1>
	<img src="/image.jpg" alt="Random image">

	<div class="input-row">
		<input id="todo-input" type="text" maxlength="140" placeholder="New todo">
		<button id="todo-send">Send</button>
	</div>
	<ul id="todo-list">
		{{range .Todos}}
		<li>
			<span>{{.Text}}</span>
			<button class="todo-delete" data-id="{{.ID}}">&times;</button>
		</li>
		{{end}}
	</ul>

	<script>
		async function sendTodo() {
			const input = document.getElementById("todo-input");
			const text = input.value.trim();
			if (!text || text.length > 140) {
				return;
			}

			await fetch("/todos", {
				method: "POST",
				headers: { "Content-Type": "application/json" },
				body: JSON.stringify({ text: text }),
			});

			input.value = "";
			window.location.reload();
		}

		async function deleteTodo(id) {
			await fetch(`/todos/${id}`, { method: "DELETE" });
			window.location.reload();
		}

		document.getElementById("todo-send").addEventListener("click", sendTodo);
		document.getElementById("todo-list").addEventListener("click", (event) => {
			if (event.target.matches(".todo-delete")) {
				deleteTodo(event.target.dataset.id);
			}
		});
	</script>
</body>
</html>
