apiVersion: batch/v1
kind: CronJob
metadata:
  name: todo-cron-job
  # namespace: project
spec:
  schedule: "0 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: todo-cron-job
            image: stevemcwin/todo_cron_job:2.9
            env:
              - name: TODO_BACKEND_URL
                valueFrom:
                  configMapKeyRef:
                    name: todo-app-config
                    key: todoBackendUrl
          restartPolicy: OnFailure
