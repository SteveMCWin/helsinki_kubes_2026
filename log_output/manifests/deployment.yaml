apiVersion: apps/v1
kind: Deployment
metadata:
  name: hashgenerator-dep
  namespace: exercises
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hashgenerator
  template:
    metadata:
      labels:
        app: hashgenerator
    spec:
      volumes:
        - name: logs
          emptyDir: {}
        - name: config
          configMap:
            name: hashgenerator-config
            items:
              - key: "information.txt"
                path: "information.txt"
      containers:
        - name: hashgenerator-reader
          image: stevemcwin/log_reader:3.2
          env:
            - name: MESSAGE
              valueFrom:
                configMapKeyRef:
                  name: hashgenerator-config
                  key: message
          volumeMounts:
            - name: logs
              mountPath: /data
            - name: config
              mountPath: /config
              readOnly: true
        - name: hashgenerator-writer
          image: stevemcwin/log_writer:1.10
          volumeMounts:
            - name: logs
              mountPath: /data
