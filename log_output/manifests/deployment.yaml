apiVersion: apps/v1
kind: Deployment
metadata:
  name: hashgenerator-dep
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hashgenerator
  template:
    metadata:
      labels:
        app: hashgenerator
    spec:
      volumes:
        - name: logs
          emptyDir: {}
        - name: pingpong-pv
          persistentVolumeClaim:
            claimName: pingpong-pvc
      containers:
        - name: hashgenerator-reader
          image: stevemcwin/log_reader:1.11
          volumeMounts:
            - name: logs
              mountPath: /data
            - name: pingpong-pv
              mountPath: /pingpong-data
        - name: hashgenerator-writer
          image: stevemcwin/log_writer:1.10
          volumeMounts:
            - name: logs
              mountPath: /data
